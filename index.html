<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Manito Manita – VPF Christmas Party</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#ffffff; --ink:#1d1d1f; --muted:#7a7a7a; --link:#0066cc; color-scheme:light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000000; --ink:#f5f5f7; --muted:#a1a1a6; --link:#2997ff; } }
    html, body { margin:0; height:100%; background:var(--bg); }
    body { font:400 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif; color:var(--ink); }
    iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
    /* loader shown until the app has loaded */
    #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
              background:var(--bg); z-index:2; transition:opacity .3s ease; text-align:center; padding:24px; }
    #loader.done { opacity:0; pointer-events:none; }
    #slow { display:none; font-size:14px; color:var(--muted); }
    #slow a { color:var(--link); }
    .spinner { font-size:36px; position:relative; display:inline-block; width:1em; height:1em; color:var(--ink); }
    .spinner div { position:absolute; left:.4629em; bottom:0; width:.074em; height:.2777em; border-radius:.0555em; background:transparent;
                   transform-origin:center -.2222em; animation:fade 1s infinite linear; }
  .spinner .b1{transform:rotate(0deg);animation-delay:0.0s}
  .spinner .b2{transform:rotate(30deg);animation-delay:0.083s}
  .spinner .b3{transform:rotate(60deg);animation-delay:0.167s}
  .spinner .b4{transform:rotate(90deg);animation-delay:0.25s}
  .spinner .b5{transform:rotate(120deg);animation-delay:0.333s}
  .spinner .b6{transform:rotate(150deg);animation-delay:0.417s}
  .spinner .b7{transform:rotate(180deg);animation-delay:0.5s}
  .spinner .b8{transform:rotate(210deg);animation-delay:0.583s}
  .spinner .b9{transform:rotate(240deg);animation-delay:0.667s}
  .spinner .b10{transform:rotate(270deg);animation-delay:0.75s}
  .spinner .b11{transform:rotate(300deg);animation-delay:0.833s}
  .spinner .b12{transform:rotate(330deg);animation-delay:0.917s}
    @keyframes fade { 0% { background-color:currentColor; } 100% { background-color:transparent; } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"><div class="b1"></div><div class="b2"></div><div class="b3"></div><div class="b4"></div><div class="b5"></div><div class="b6"></div><div class="b7"></div><div class="b8"></div><div class="b9"></div><div class="b10"></div><div class="b11"></div><div class="b12"></div></div>
    <p id="slow">Taking longer than usual. <a id="direct" href="#" target="_blank" rel="noopener">Open the app directly</a></p>
  </div>
  <iframe id="app" title="Manito Manita" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
  <noscript><p style="padding:24px">JavaScript is required to open this app.</p></noscript>

  <script>
    // >>> Paste your Apps Script web app URL here (Deploy > Manage deployments > Web app URL, ends with /exec)
    const GAS_URL = 'https://script.google.com/a/macros/usc.edu.ph/s/AKfycbziZgqcOAtjCLTNWalF4iqQ2o8h3bustYQIzHa1lgVYJCjM-fzy33wNouaFC_R5gpQe/exec';

    const src = GAS_URL + location.search;           // keeps any ?query you add to the wrapper link
    const frame = document.getElementById('app'), loader = document.getElementById('loader');
    document.getElementById('direct').href = src;
    frame.src = src;
    frame.addEventListener('load', () => loader.classList.add('done'));
    setTimeout(() => { if (!loader.classList.contains('done')) document.getElementById('slow').style.display = 'block'; }, 12000);
  </script>
</body>
</html>
