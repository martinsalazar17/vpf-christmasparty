<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPF Manito Manita</title>
<meta name="description" content="VPF Christmas Party Manito Manita">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VPF Manito Manita">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; }
  #offline { position:fixed; left:0; right:0; top:0; z-index:5; padding:8px 12px; text-align:center; background:#b3261e; color:#fff; font:600 14px/1.3 system-ui, sans-serif; }
  #help { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.6); }
  #help[hidden], #offline[hidden] { display:none; }
  #help .card { max-width:380px; width:100%; background:#fff; color:#1d1d1f; border-radius:18px; padding:22px; font:400 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  #help h2 { margin:0 0 8px; font-size:20px; }
  #help p { margin:8px 0; }
  #help button { margin-top:12px; width:100%; min-height:46px; border:0; border-radius:9999px; background:#7C3AED; color:#fff; font:600 16px/1 system-ui, sans-serif; cursor:pointer; }
</style>
</head>
<body>
  <!-- PASTE YOUR WEB APP LINK (the one that ends in /exec) between the quotes of src -->
  <iframe id="app" title="VPF Manito Manita" src="https://script.google.com/macros/s/AKfycbzvv4ADO7gmhdvvTStsLWiDvFxqRXCEuaTN6CmNsM-ig4NLQOm28NLjRNgyeh1P20OH3Q/exec" allow="fullscreen; clipboard-write"></iframe>
  <div id="offline" hidden>You are offline. Connect to the internet to use Manito Manita.</div>
  <div id="help" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <h2 id="helpT">Add to Home Screen</h2>
    <div id="helpBody"></div>
    <button type="button" id="helpOk">OK</button>
  </div></div>

<script>
  // ---- service worker (keeps the shell and icons; the app itself always loads live) ----
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

  // ---- install ----
  let deferred = null;
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });       // Chrome / Edge / Android: kept until the app's "+ Add to Home Screen" button is pressed
  addEventListener('appinstalled', () => { deferred = null; });

  const ua = navigator.userAgent, iOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  function help() {
    let html;
    if (standalone()) html = '<p>Manito Manita is already on your home screen. \u2713</p>';
    else if (iOS) html = '<p>1. Tap the <b>Share</b> button (the square with an arrow) in Safari.</p><p>2. Scroll and tap <b>Add to Home Screen</b>.</p><p>3. Tap <b>Add</b>.</p>';
    else if (/android/i.test(ua)) html = '<p>1. Tap the <b>\u22EE</b> menu in Chrome.</p><p>2. Tap <b>Add to Home screen</b> (or <b>Install app</b>).</p><p>3. Tap <b>Add</b>.</p>';
    else html = '<p>In Chrome or Edge, click the <b>install icon</b> at the right end of the address bar, or open the browser menu and choose <b>Install VPF Manito Manita</b>.</p>';
    document.getElementById('helpBody').innerHTML = html;
    document.getElementById('help').hidden = false;
  }
  document.getElementById('helpOk').onclick = () => { document.getElementById('help').hidden = true; };

  // The app (inside the frame) sends a message when its "+ Add to Home Screen" button is pressed. Only Google's own pages may send it.
  addEventListener('message', async ev => {
    if (!ev.data || ev.data.type !== 'mm-install') return;
    let host = ''; try { host = new URL(ev.origin).hostname; } catch (e) {}
    if (!/(^|\.)(googleusercontent|google)\.com$/.test(host)) return;
    if (deferred && !standalone()) {
      const p = deferred; deferred = null;
      try { await p.prompt(); await p.userChoice; } catch (e) { help(); }
    } else help();
  });

  // ---- offline notice ----
  const off = document.getElementById('offline');
  const net = () => { off.hidden = navigator.onLine; };
  addEventListener('online', net); addEventListener('offline', net); net();
</script>
</body>
</html>
